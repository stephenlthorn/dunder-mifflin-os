name: Bug report
description: Something in Dunder Mifflin OS doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problem?** Don't file it here: see SECURITY.md and report it privately.
        Please don't paste tokens, chat ids, real task titles or messages; redact them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx dunder-mifflin-os --demo`
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - npx
        - Docker / docker compose
        - From source (npm run start / dev)
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data source
      options:
        - Demo (--demo or ?demo=1)
        - Live Hermes
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npx dunder-mifflin-os --version`, the image tag or the commit."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.13, Chrome 140, Hermes 0.21"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines (JSON on stderr) or browser console errors. Redact anything private.
      render: shell
